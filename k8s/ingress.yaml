apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: azure-app-config-ingress
  namespace: default
  annotations:
    # Set proxy body size
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # Enable logging for debugging
    nginx.ingress.kubernetes.io/enable-access-log: "true"
    # Use real IP from load balancer
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    # Connection settings
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    # cert-manager annotations for automatic TLS certificate management
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Force redirect HTTP to HTTPS
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - app.mikegaohahahahagogogogo.site
    secretName: azure-app-config-tls
  rules:
  # WWW subdomain (optional)
  - host: app.mikegaohahahahagogogogo.site
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: azure-app-config-internal-service
            port:
              number: 80

