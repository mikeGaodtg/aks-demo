apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-config-deployment
  labels:
    app: azure-app-config-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: azure-app-config-app
  template:
    metadata:
      labels:
        app: azure-app-config-app
    spec:
      # NO SERVICE ACCOUNT NEEDED when using node pool managed identity!
      containers:
      - name: app-config-container
        #image: mikeacr1.azurecr.io/azure-app-config-app:latest 
        image: wsztg008/azure-app-config-app:latest  # Your Node.js app image
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        - name: PORT
          value: "3000"
        - name: NODE_ENV
          value: "production"
        - name: AZURE_APP_CONFIG_ENDPOINT
          value: "https://app-config-mikegao-1.azconfig.io"
        # Optional: Only specify if node pool has multiple managed identities
        # and you want to use a specific one
        # - name: AZURE_CLIENT_ID
        #   value: "63b2867c-57e5-4150-aeca-da497348b4a6"  # Kubelet identity client ID
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5

